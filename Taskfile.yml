version: '3'

dir: '{{.ROOT_DIR}}'

vars:
  APP_NAME: ZhiziTime
  BUILD_DIR: '{{.ROOT_DIR}}/.build/release'
  APP_DIR: '{{.ROOT_DIR}}/dist/{{.APP_NAME}}.app'
  INSTALL_DIR: '{{.HOME}}/Applications'

platforms: [darwin]

tasks:
  default:
    desc: 显示可用的 macOS 任务
    cmds:
      - task --list

  macos:doctor:
    desc: 显示 Swift、Python、Sparkle 和 macOS SDK 工具路径
    cmds:
      - swift --version
      - python3 --version
      - xcrun --find swiftc
      - xcrun --find notarytool
      - xcrun --show-sdk-path

  macos:check:
    desc: 检查 Swift 包结构并编译源码，不启动应用
    cmds:
      - swift package describe
      - swift build -c debug

  macos:test:
    desc: 运行 Swift 渲染回归测试和 macOS 工作流测试，不启动应用
    cmds:
      - swift test
      - task: macos:workflow:test

  macos:build:
    desc: 构建当前架构的 macOS release 可执行文件，不测试、安装或启动
    cmds:
      - swift build -c release --product {{shellQuote .APP_NAME}}

  macos:app:
    desc: 构建并打包本地 .app，使用临时签名并校验，不安装或启动
    summary: |
      默认输出 dist/ZhiziTime.app，先在临时目录组装并验证，再替换旧产物。
      临时签名不访问开发者证书；产物仅用于本机，不包含公证或公开分发校验。
    cmds:
      - task: macos:build
      - python3 scripts/macos.py package --binary {{shellQuote (printf "%s/%s" .BUILD_DIR .APP_NAME)}} --app {{shellQuote .APP_DIR}}

  macos:dmg:
    desc: 构建、签名并创建版本化 Release DMG
    cmds:
      - bash scripts/package_dmg.sh {{.CLI_ARGS}}

  release:prepare:
    desc: 更新 VERSION、README 和 CHANGELOG，准备下一次发布
    cmds:
      - python3 scripts/prepare_release.py {{.CLI_ARGS}}

  release-check:
    desc: 校验版本、Sparkle 和 Release workflow 元数据
    cmds:
      - python3 scripts/release_check.py {{.CLI_ARGS}}

  sparkle:keys:
    desc: 从 macOS 钥匙串初始化并写入 Sparkle 公钥
    cmds:
      - bash scripts/configure_sparkle_keys.sh setup

  sparkle:keys:check:
    desc: 校验仓库中的 Sparkle 公钥与 macOS 钥匙串一致
    cmds:
      - bash scripts/configure_sparkle_keys.sh check

  sparkle:keys:export-private:
    desc: 显式导出 Sparkle 私钥，供手动写入 GitHub Secret
    cmds:
      - bash scripts/configure_sparkle_keys.sh export-private {{.CLI_ARGS}}

  macos:verify:
    desc: 校验已有 .app 的标识、可执行文件、图标和签名，不构建或启动
    cmds:
      - python3 scripts/macos.py verify --app {{shellQuote .APP_DIR}}

  macos:install:
    desc: 安装已有 .app 到 INSTALL_DIR，校验失败保留旧版，不构建或启动
    summary: |
      默认安装到 ~/Applications/ZhiziTime.app，不提权。
      INSTALL_DIR 和 APP_DIR 的相对路径均以仓库根目录为基准。
      目标应用正在运行时拒绝覆盖；请先通过菜单栏退出。
    cmds:
      - python3 scripts/macos.py install --app {{shellQuote .APP_DIR}} --install-dir {{shellQuote .INSTALL_DIR}}

  macos:launch:
    desc: 打开已有 .app，最多等待 10 秒确认目标路径对应的进程，不构建
    cmds:
      - python3 scripts/macos.py launch --app {{shellQuote .APP_DIR}}

  macos:run:
    desc: 构建、打包并打开本地浮层应用，最多等待 10 秒确认启动
    cmds:
      - task: macos:app
      - task: macos:launch

  macos:logs:
    desc: 持续查看 ZhiziTime 的系统日志，按 Ctrl-C 退出，不启动应用
    cmds:
      - /usr/bin/log stream --style compact --predicate 'process == "ZhiziTime"'

  macos:workflow:test:
    desc: 用临时目录和替身命令测试工作流，不构建或安装真实应用
    cmds:
      - python3 -m unittest discover -s tests -p 'test_*.py'

  macos:clean:
    desc: 删除本项目生成的 .build 和 dist 产物
    cmds:
      - rm -rf .build dist
