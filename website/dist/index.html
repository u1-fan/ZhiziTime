<!doctype html>
<html lang="zh-CN" data-ink="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="智子时间：把一串持续出现的时间叠在风景、人物和日常照片上。像胶片上的时间标记，让当下始终位于可视区域。" />
  <meta property="og:title" content="智子时间｜一串永远在场的时间" />
  <meta property="og:description" content="人文、风景、照片，以及无时无刻叠在画面上的时间。" />

  <title>智子时间｜一串永远在场的时间</title>
  <style>
    :root {
      --ink: #fff;
      --ink-soft: rgba(255,255,255,.74);
      --ink-faint: rgba(255,255,255,.48);
      --ink-line: rgba(255,255,255,.42);
      --panel: rgba(10,10,10,.34);
      --veil: .15;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      --mono: "SFMono-Regular", "Roboto Mono", "Cascadia Code", "Liberation Mono", ui-monospace, monospace;
    }
    :root[data-ink="dark"] { --ink: #090909; --ink-soft: rgba(9,9,9,.70); --ink-faint: rgba(9,9,9,.54); --ink-line: rgba(9,9,9,.44); --panel: rgba(255,255,255,.38); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #111; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: #111; font-family: var(--sans); }
    body.is-locked { overflow: hidden; }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .stage { position: relative; min-height: 100svh; overflow: hidden; isolation: isolate; background: #111; }
    .scene-layer, .scene-layer::after { position: absolute; inset: 0; }
    .scene-layer { z-index: -2; background: #111; }
    .scene-layer::after { content: ""; z-index: 2; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.04) 35%, rgba(0,0,0,.20) 100%), linear-gradient(90deg, rgba(0,0,0,.22), transparent 50%, rgba(0,0,0,.12)); opacity: var(--veil); mix-blend-mode: multiply; }
    :root[data-ink="dark"] .scene-layer::after { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02) 45%, rgba(255,255,255,.18)), linear-gradient(90deg, rgba(255,255,255,.18), transparent 50%, rgba(255,255,255,.10)); mix-blend-mode: screen; }
    .scene-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: 0; transform: scale(1.045); transition: opacity 1.2s ease, transform 8s ease; filter: saturate(.86) contrast(1.06); }
    .scene-image.is-active { opacity: 1; transform: scale(1); }
    .scene-image.is-leaving { opacity: 0; transform: scale(1.02); }
    .frame { width: min(1440px, calc(100% - 44px)); margin: 0 auto; }
    .topbar { position: relative; z-index: 4; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding-top: 28px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 760; letter-spacing: -.04em; }
    .brand-mark { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid var(--ink); border-radius: 50%; font: 700 12px/1 var(--mono); }
    .brand small { display: block; margin-top: 3px; color: var(--ink-soft); font: 600 9px/1 var(--mono); letter-spacing: .18em; }
    .top-meta { display: flex; align-items: center; gap: 20px; color: var(--ink-soft); font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .github-link { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; }
    .github-link svg { width: 15px; height: 15px; fill: currentColor; }
    .github-link:hover, .github-link:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
    .live { display: inline-flex; align-items: center; gap: 7px; }
    .live i { width: 6px; height: 6px; display: inline-block; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink) 12%, transparent); }
    .hero-copy { position: relative; z-index: 3; min-height: calc(100svh - 60px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 0 140px; text-align: center; }
    .eyebrow { margin: 0 0 25px; color: var(--ink-soft); font: 600 11px/1.4 var(--mono); letter-spacing: .2em; text-transform: uppercase; }
    h1 { max-width: 100%; margin: 0; font-size: clamp(58px, 10vw, 156px); line-height: .9; letter-spacing: -.12em; font-weight: 760; white-space: nowrap; }
    .hero-lede { max-width: 490px; margin: 26px 0 0; color: var(--ink-soft); font-size: clamp(18px, 2vw, 25px); line-height: 1.5; letter-spacing: .08em; text-shadow: 0 1px 18px rgba(0,0,0,.18); }
    .time-card { position: relative; z-index: 4; width: auto; margin-top: 58px; padding: 0; border: 0; border-radius: 0; background: transparent; backdrop-filter: none; box-shadow: none; }
    .time-card-head, .time-context, .trace { display: none; }
    .time-code { margin: 0; color: var(--ink); opacity: .15; font: 500 clamp(30px, 6.5vw, 104px)/.92 var(--mono); letter-spacing: -.08em; white-space: nowrap; }
    .release-cta-wrap { margin-top: 38px; text-align: center; }
    .release-download { display: inline-flex; align-items: baseline; gap: 14px; padding: 18px 32px; border: 1px solid rgba(255,255,255,.28); border-radius: 26px; background: #f3f3ef; color: #111; text-decoration: none; box-shadow: 0 12px 35px rgba(0,0,0,.18); }
    .release-download strong { font-size: clamp(18px, 1.8vw, 25px); letter-spacing: -.04em; }
    .release-download span { color: #737373; font-size: clamp(12px, 1.1vw, 15px); }
    .release-download:hover, .release-download:focus-visible { transform: translateY(-2px); }
    .release-subtitle { margin: 9px 0 0; color: var(--ink-soft); font: 10px var(--mono); letter-spacing: .08em; }
    :root[data-ink="dark"] .release-download { border-color: rgba(0,0,0,.3); background: #101010; color: #fff; }
    :root[data-ink="dark"] .release-download span { color: #aaa; }

    :root[data-ink="light"] .time-code { text-shadow: 0 0 2px rgba(0,0,0,.92), 0 3px 25px rgba(0,0,0,.44); }
    :root[data-ink="dark"] .time-code { text-shadow: 0 0 2px rgba(255,255,255,.95), 0 3px 25px rgba(255,255,255,.42); }
    .time-context { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; color: var(--ink-soft); font: 11px/1.5 var(--mono); }
    .trace { display: flex; gap: 14px; margin-top: 19px; overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent); }
    .trace span { color: var(--ink-faint); font: 10px var(--mono); letter-spacing: .06em; }
    .trace span:first-child { color: var(--ink); }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    @media (max-width: 820px) {
      .frame { width: min(100% - 30px, 1440px); }
      .hero-copy { min-height: calc(100svh - 40px); padding: 90px 0 190px; }
      .time-card { padding: 19px 17px; }
      .time-code { font-size: clamp(35px, 10.5vw, 82px); }
      .top-meta { font-size: 9px; }
      .about-grid { grid-template-columns: 1fr; gap: 50px; }
    }
    @media (max-width: 560px) {
      .topbar { padding-top: 18px; }
      .top-meta .zone { display: none; }
      h1 { font-size: clamp(58px, 18vw, 96px); }
      .hero-lede { font-size: 15px; }
      .time-code { font-size: clamp(22px, 7.8vw, 48px); letter-spacing: -.08em; }
      .release-download { flex-direction: column; align-items: center; gap: 4px; padding: 16px 24px; }
      .time-card-head { font-size: 9px; }
      .about { padding: 88px 0 100px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="top">
    <div class="scene-layer" aria-hidden="true">
      <img class="scene-image is-active" data-scene="0" src="images/mountain-dawn.png" alt="晨雾中的山谷与远望的人" />
      <img class="scene-image" data-scene="1" src="images/window-blue-hour.png" alt="雨窗外的蓝调城市与室内灯光" />
      <img class="scene-image" data-scene="3" src="images/night-city.png" alt="夜晚街道上独自行走的人" />
      <img class="scene-image" data-scene="4" src="images/city-morning.png" alt="清晨城市路口等待的人" />
      <img class="scene-image" data-scene="5" src="images/seaside-dusk.png" alt="黄昏海边站立的人" />
    </div>
    <header class="frame topbar">
      <a class="brand" href="#top" aria-label="智子时间首页"><span class="brand-mark" aria-hidden="true">时</span><span>智子时间<small>ZHIZI TIME / FILM 001</small></span></a>
      <div class="top-meta"><span class="zone" id="zone">LOCAL TIME</span><span class="live"><i aria-hidden="true"></i> OBSERVING</span><a class="github-link" href="https://github.com/u1-fan/ZhiziTime" target="_blank" rel="noreferrer" aria-label="GitHub 项目仓库"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.34-3.8-1.34-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.68.08-.68 1.13.08 1.73 1.16 1.73 1.16 1 .1.99 1.96 2.74 1.4.1-.73.4-1.23.72-1.51-2.5-.28-5.12-1.25-5.12-5.56 0-1.23.44-2.24 1.16-3.03-.12-.28-.5-1.44.11-2.99 0 0 .95-.3 3.1 1.16a10.7 10.7 0 0 1 5.64 0c2.15-1.46 3.1-1.16 3.1-1.16.61 1.55.23 2.71.11 2.99.72.79 1.16 1.8 1.16 3.03 0 4.32-2.63 5.27-5.14 5.55.4.35.77 1.04.77 2.1v3.12c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8Z"/></svg><span>GITHUB</span><span aria-hidden="true">↗</span></a></div>
    </header>

    <section class="frame hero-copy" aria-label="智子时间实时画面">
      <h1>智子时间</h1>
      <p class="hero-lede">你们是虫子</p>
      <div class="time-card">
        <p class="time-code" id="time-code" aria-live="off">00:00:00</p>
      </div>
      <div class="release-cta-wrap"><a class="release-download" href="https://github.com/u1-fan/ZhiziTime/releases" target="_blank" rel="noreferrer"><strong>下载发布版</strong><span>v0.5.0 · GitHub Releases ↗</span></a><p class="release-subtitle">开源 · 智子时间 · 查看全部版本</p></div>
    </section>

  </main>


  <script>
    (() => {
      const root = document.documentElement;
      const images = [...document.querySelectorAll('.scene-image')];
      const timeCode = document.getElementById('time-code');
      const zone = document.getElementById('zone');
      let current = 0;
      let timer;
      const pad = (n, size = 2) => String(n).padStart(size, '0');
      const formatTime = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const showScene = (index) => {
        current = index;
        images.forEach((image, i) => image.classList.toggle('is-active', i === index));
      };
      const nextScene = () => showScene((current + 1) % images.length);
      const tick = () => {
        const now = new Date();
        timeCode.textContent = formatTime(now);
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone.replaceAll('_', ' ');
        zone.textContent = tz;
        requestAnimationFrame(tick);
      };
      images.forEach((image) => image.addEventListener('click', nextScene));
      setInterval(nextScene, 9000);
      tick();
    })();
  </script>
</body>
</html>
